    function App() {
      const [inputText, setInputText] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [loadingStep, setLoadingStep] = useState(0); 
      const [result, setResult] = useState(null);
      const [showWarning, setShowWarning] = useState(false);
      const [isAiGenerated, setIsAiGenerated] = useState(false); 
      
      const [activeQuizzes, setActiveQuizzes] = useState([]);
      const [currentQuizIndex, setCurrentQuizIndex] = useState(0);
      const [quizAnswered, setQuizAnswered] = useState(false);
      const [selectedOptionIndex, setSelectedOptionIndex] = useState(null);
      const [quizFeedback, setQuizFeedback] = useState('');
      const [correctAnswersCount, setCorrectAnswersCount] = useState(0);
      const [quizFinished, setQuizFinished] = useState(false);
      
      const [hasTested, setHasTested] = useState(false); 
      const [latestScore, setLatestScore] = useState(null); 

      useEffect(() => {
        initializeQuizSession();
      }, []);

      const initializeQuizSession = () => {
        const shuffled = [...MASTER_QUIZZES];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        setActiveQuizzes(shuffled.slice(0, 5));
        setCurrentQuizIndex(0);
        setQuizAnswered(false);
        setSelectedOptionIndex(null);
        setQuizFeedback('');
        setCorrectAnswersCount(0);
        setQuizFinished(false);
      };

      const handleSelectExample = (item) => {
        setInputText(item.text);
        setShowWarning(false);
      };

      const handleQuizAnswer = (optionIdx, isCorrect) => {
        if (quizAnswered) return;
        setQuizAnswered(true);
        setSelectedOptionIndex(optionIdx);

        if (isCorrect) {
          setCorrectAnswersCount(prev => prev + 1);
          setQuizFeedback('🎉 올바른 분석입니다! 정확한 팩트 체크 안목을 보여주셨어요.');
        } else {
          setQuizFeedback('💡 아쉽게도 정답이 아닙니다. 아래 설명된 교차 검증 팁을 참고해 보세요.');
        }
      };

      const handleNextQuiz = () => {
        if (currentQuizIndex < activeQuizzes.length - 1) {
          setCurrentQuizIndex(prev => prev + 1);
          setQuizAnswered(false);
          setSelectedOptionIndex(null);
          setQuizFeedback('');
        } else {
          setQuizFinished(true);
          setHasTested(true);
          setLatestScore(correctAnswersCount);
        }
      };

      const getHeaderRankTitle = (score) => {
        if (score === 5) return "리터러시 마스터 🏆";
        if (score >= 3) return "팩트 가디언 🛡️";
        if (score >= 1) return "정보 탐정 🔍";
        return "초보 분석가 🌱";
      };

      const scrollToQuiz = () => {
        const element = document.getElementById('quiz-section');
        if (element) {
          element.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      };

      const handleAnalyze = async () => {
        if (!inputText.trim()) {
          setShowWarning(true);
          setTimeout(() => setShowWarning(false), 3500);
          return;
        }

        setShowWarning(false);
        setIsLoading(true);
        setResult(null);
        setIsAiGenerated(false);

        setLoadingStep(1);
        const stepInterval = setInterval(() => {
          setLoadingStep(prev => (prev < 3 ? prev + 1 : prev));
        }, 600);

        try {
          const cleanedInput = inputText.replace(/\s+/g, '');
          let matchedCase = null;
          if (cleanedInput.includes('세종대왕') && (cleanedInput.includes('맥북') || cleanedInput.includes('던짐'))) {
            matchedCase = SAMPLE_CASES[0];
          } else if (cleanedInput.includes('독도') && cleanedInput.includes('경상북도')) {
            matchedCase = SAMPLE_CASES[1];
          } else if (cleanedInput.includes('바나나') && cleanedInput.includes('냄새')) {
            matchedCase = SAMPLE_CASES[2];
          }

          if (matchedCase) {
            setResult(matchedCase);

                  <span className="text-xl">🎮</span>
                  <div>
                    <h4 className="text-sm md:text-base font-bold text-slate-800 leading-none">디지털 리터러시 진단 퀴즈 (무작위 5선)</h4>
                    <p className="text-[11px] text-slate-500 mt-1">총 50개의 검증 데이터베이스에서 추출된 5개 문항을 풀어보세요.</p>
                  </div>
                </div>
                {activeQuizzes.length > 0 && (
                  <div className="bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-xs font-black text-slate-700">
                    🏆 현재 점수: {correctAnswersCount} / {activeQuizzes.length}
                  </div>
                )}
              </div>

              {activeQuizzes.length > 0 && !quizFinished ? (
                <div className="bg-white p-4 md:p-6 rounded-xl border border-slate-200">
                  <div className="flex items-center justify-between text-xs text-slate-500 font-bold mb-4 border-b border-slate-50 pb-2">
                    <span>문항 {currentQuizIndex + 1} / {activeQuizzes.length}</span>
                  </div>

                  <p className="text-sm md:text-base font-bold text-slate-800 mb-4 leading-relaxed">
                    Q. {activeQuizzes[currentQuizIndex].question}
                  </p>

                  <div className="grid grid-cols-1 gap-2.5">
                    {activeQuizzes[currentQuizIndex].options.map((option, idx) => {
                      let btnStyle = 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50';
                      
                      if (quizAnswered) {
                        if (option.isCorrect) {
                          btnStyle = 'bg-emerald-50 border-emerald-400 text-emerald-800';
                        } else if (selectedOptionIndex === idx) {
                          btnStyle = 'bg-rose-50 border-rose-300 text-rose-800';
                        } else {
                          btnStyle = 'bg-slate-50 border-slate-100 text-slate-400 opacity-60';
                        }
                      }

                      return (
                        <button
                          key={idx}
                          disabled={quizAnswered}
                          onClick={() => handleQuizAnswer(idx, option.isCorrect)}
                          className={`w-full text-left p-3.5 rounded-lg border font-bold text-xs md:text-sm transition-all flex items-center justify-between cursor-pointer ${btnStyle}`}
                        >
                          <span className="pr-4 leading-normal">{option.text}</span>
                          {quizAnswered && option.isCorrect && (
                            <span className="text-emerald-600 text-[10px] font-bold bg-emerald-100 border px-2 py-0.5 rounded">정답</span>
                          )}
                        </button>
                      );
                    })}
                  </div>

                  {quizAnswered && (
                    <div className="mt-4 p-4 bg-slate-50 rounded-xl border border-slate-200 text-xs text-slate-700">
                      <p className="font-extrabold text-slate-800 mb-1">{quizFeedback}</p>
                      <p className="leading-relaxed text-slate-500 font-medium">{activeQuizzes[currentQuizIndex].comment}</p>
                      
                      <div className="mt-4 flex justify-end">
                        <button
                          onClick={handleNextQuiz}
                          className="bg-slate-800 hover:bg-slate-900 text-white font-bold px-4 py-2 rounded-lg text-xs cursor-pointer"
                        >
                          <span>{currentQuizIndex === activeQuizzes.length - 1 ? '최종 결과 진단하기' : '다음 문제 ➡️'}</span>
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              ) : (
                <div className="bg-white p-6 md:p-8 rounded-xl border border-slate-200 text-center space-y-6">
                  <span className="text-5xl block">🏆</span>
                  <div>
                    <h5 className="text-lg md:text-xl font-extrabold text-slate-800">디지털 팩트체크 진단 완료!</h5>
                    <p className="text-slate-500 text-xs md:text-sm max-w-md mx-auto leading-relaxed mt-1">
                      5개의 엄선된 진단 문제를 마쳤습니다. 판단 등급은 아래와 같습니다.
                    </p>
                  </div>

                  <div className="inline-flex bg-sky-50 border border-sky-100 rounded-xl px-5 py-3 text-xs md:text-sm text-sky-800 font-bold items-center space-x-2 mx-auto">
                    <span>내 최종 정답 수:</span>
                    <span className="bg-sky-600 text-white font-black px-3 py-1 rounded-md text-sm">{correctAnswersCount} / 5 개</span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-left">
                    {RANK_INFOS.map((rank) => {
                      const isCurrentRank = rank.checkFn(correctAnswersCount);
                      return (
                        <div
                          key={rank.id}
                          className={`p-4 rounded-xl border transition-all ${
                            isCurrentRank 
                              ? `${rank.highlightColor} border-transparent` 
                              : `${rank.bgColor} opacity-60 border-dashed`
                          }`}
                        >
                          <div className="flex items-center justify-between mb-1">
                            <h6 className="font-extrabold text-sm flex items-center gap-1.5">{rank.title}</h6>
                            <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${rank.badgeColor}`}>{rank.scoreRange}</span>
                          </div>
                          <p className="text-xs font-semibold mb-2">{rank.desc}</p>
                          {isCurrentRank && (
                            <div className="mt-2 pt-2 border-t border-slate-200/50 text-[11px] font-bold text-sky-700">
                              {rank.blueText}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  <div className="pt-4 border-t border-slate-100">
                    <button
                      onClick={initializeQuizSession}
                      className="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-6 rounded-lg text-xs cursor-pointer"
                    >
                      🔄 새로운 문항으로 다시 진단받기
                    </button>
                  </div>
                </div>
              )}
            </div>
          </main>

          <footer className="bg-white border-t border-slate-200 py-8 px-4 text-center text-[11px] text-slate-400">
            <p className="font-bold text-slate-500">© 2026 디지털 팩트체크 가이드 (Fact-Check Guide). All Rights Reserved.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
